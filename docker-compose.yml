services:
  redis:
    image: redis:7-alpine
    container_name: wh-bot-redis
    restart: unless-stopped
    # PM2 tourne sur l'hôte : host network évite docker-proxy (ECONNREFUSED/RESET).
    # bind 127.0.0.1 = pas d'exposition Internet.
    network_mode: host
    volumes:
      - redis-data:/data
    command: >-
      redis-server
      --appendonly yes
      --timeout 0
      --tcp-keepalive 60
      --bind 127.0.0.1
      --protected-mode yes

volumes:
  redis-data:
