services:
  redis:
    image: redis:7-alpine
    container_name: wh-bot-redis
    restart: unless-stopped
    # Bind localhost only — never expose Redis on 0.0.0.0 (VPS public IP).
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --timeout 0 --tcp-keepalive 60

volumes:
  redis-data:
